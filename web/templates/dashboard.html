<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi Video Player</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Video Player</h1>
            <div class="header-info">
                <span id="status-indicator" class="status-stopped">●</span>
                <span id="status-text">Stopped</span>
            </div>
        </header>

        <div class="main-content">
            <div class="panel visual-panel">
                <h2>Visual Layout</h2>

                <div class="control-group">
                    <label>Display Resolution:</label>
                    <div class="resolution-controls">
                        <input type="number" id="display-width" value="1920" min="640" max="7680" step="1">
                        <span>x</span>
                        <input type="number" id="display-height" value="1080" min="480" max="4320" step="1">
                        <button id="update-resolution" class="btn btn-secondary">Update</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Display Mode:</label>
                    <div class="source-type-toggle">
                        <button id="mode-1080p" class="btn btn-toggle active" onclick="setDisplayMode('1080p')">1080p</button>
                        <button id="mode-4k" class="btn btn-toggle" onclick="setDisplayMode('4k')">4K</button>
                    </div>
                    <span id="mode-status" style="font-size:0.75rem;color:#888;margin-left:8px;"></span>
                </div>

                <canvas id="layout-canvas" width="960" height="540"></canvas>
                <p class="canvas-help">Drag to move - Drag corners to resize</p>

                <div class="preset-buttons" id="preset-buttons"></div>
            </div>

            <div class="panel control-panel">

                <div class="section">
                    <h3>Video Source</h3>
                    <div class="control-group">
                        <label>Source Type:</label>
                        <div class="source-type-toggle">
                            <button id="source-type-file" class="btn btn-toggle active">Local File</button>
                            <button id="source-type-rtsp" class="btn btn-toggle">RTSP Stream</button>
                        </div>
                    </div>
                    <div id="source-file-controls" class="source-controls">
                        <select id="video-file" class="video-select">
                            <option value="">Select a video...</option>
                        </select>
                    </div>
                    <div id="source-rtsp-controls" class="source-controls" style="display:none;">
                        <input type="text" id="rtsp-url" placeholder="rtsp://..." class="input-text">
                    </div>
                    <div class="playback-controls">
                        <button id="play-btn" class="btn btn-primary">Play</button>
                        <button id="pause-btn" class="btn btn-secondary">Pause</button>
                        <button id="stop-btn" class="btn btn-danger">Stop</button>
                    </div>
                </div>

                <div class="section">
                    <h3>Window Geometry</h3>
                    <div class="geometry-grid">
                        <div><label>X:</label><input type="number" id="geom-x" value="0" min="0" class="input-number"></div>
                        <div><label>Y:</label><input type="number" id="geom-y" value="0" min="0" class="input-number"></div>
                        <div><label>Width:</label><input type="number" id="geom-width" value="1920" min="100" class="input-number"></div>
                        <div><label>Height:</label><input type="number" id="geom-height" value="1080" min="100" class="input-number"></div>
                    </div>
                    <button id="apply-geometry" class="btn btn-secondary full-width">Apply Geometry</button>
                </div>

                <div class="section">
                    <h3>Playback Settings</h3>
                    <div class="control-group">
                        <label>Volume: <span id="volume-value">50</span>%</label>
                        <input type="range" id="volume-slider" min="0" max="100" value="50" class="slider">
                    </div>
                    <div class="control-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="loop-checkbox" checked>
                            Loop Playback
                        </label>
                    </div>
                </div>

                <div class="section" id="seek-section" style="display:none;">
                    <h3>Position</h3>
                    <div class="time-display">
                        <span id="current-time">0:00</span>
                        <span>/</span>
                        <span id="duration-time">0:00</span>
                    </div>
                    <input type="range" id="seek-slider" min="0" max="100" value="0" class="slider">
                    <div class="seek-buttons">
                        <button id="seek-back" class="btn btn-secondary">-10s</button>
                        <button id="seek-forward" class="btn btn-secondary">+10s</button>
                    </div>
                </div>

                <div class="section">
                    <h3>File Management</h3>
                    <div class="file-upload">
                        <input type="file" id="file-input" accept="video/*" style="display:none;">
                        <button id="upload-btn" class="btn btn-primary full-width">Upload Video</button>
                        <div id="upload-progress" class="upload-progress" style="display:none;">
                            <div id="upload-progress-bar" class="upload-progress-bar"></div>
                            <span id="upload-progress-text">0%</span>
                        </div>
                    </div>
                    <div class="file-list" id="file-list"></div>
                </div>

                <div class="section">
                    <h3>Save Layout Preset</h3>
                    <div class="preset-save">
                        <input type="text" id="preset-name" placeholder="Preset name..." class="input-text">
                        <input type="text" id="preset-description" placeholder="Description (optional)..." class="input-text">
                        <button id="save-preset" class="btn btn-primary full-width">Save Current Layout</button>
                    </div>
                    <div class="preset-list" id="preset-list"></div>
                </div>

                <div class="section" id="sync-section">
                    <h3>Multi-Player Sync</h3>
                    <div class="control-group">
                        <label>Sync Mode:</label>
                        <div class="source-type-toggle">
                            <button id="sync-mode-disabled" class="btn btn-toggle active" onclick="setSyncMode('disabled')">Off</button>
                            <button id="sync-mode-master" class="btn btn-toggle" onclick="setSyncMode('master')">Master</button>
                            <button id="sync-mode-remote" class="btn btn-toggle" onclick="setSyncMode('remote')">Remote</button>
                        </div>
                    </div>
                    <div id="sync-master-ip-group" class="control-group" style="display:none;">
                        <label>Master IP (optional):</label>
                        <input type="text" id="sync-master-ip" placeholder="Leave blank for multicast" class="input-text">
                        <p style="font-size:0.75rem;color:#888;margin:2px 0 0;">Leave blank to auto-discover master on local network</p>
                    </div>
                    <div id="sync-status-box" class="sync-status" style="display:none;">
                        <span id="sync-status-label">-</span>
                    </div>

                    <div id="remotes-section" style="display:none;margin-top:12px;">
                        <label style="font-weight:600;">Remote Players:</label>
                        <div id="remotes-list" style="margin:8px 0;"></div>
                        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
                            <input type="text" id="remote-ip" placeholder="IP address" class="input-text" style="flex:2;min-width:120px;">
                            <input type="number" id="remote-port" placeholder="Port" value="5000" class="input-number" style="flex:1;min-width:70px;">
                            <input type="text" id="remote-name" placeholder="Name" class="input-text" style="flex:2;min-width:100px;">
                            <button class="btn btn-primary" onclick="addRemote()">Add</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/canvas-controller.js"></script>
    <script src="/static/js/dashboard.js"></script>

<script>
async function setDisplayMode(mode) {
    const statusEl = document.getElementById('mode-status');
    statusEl.textContent = 'Switching...';
    try {
        const r = await fetch('/api/display/mode', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({mode})
        });
        const d = await r.json();
        if (d.error) { statusEl.textContent = 'Error: ' + d.error; return; }
        document.getElementById('mode-1080p').classList.toggle('active', mode === '1080p');
        document.getElementById('mode-4k').classList.toggle('active', mode === '4k');
        const w = mode === '4k' ? 3840 : 1920;
        const h = mode === '4k' ? 2160 : 1080;
        document.getElementById('display-width').value = w;
        document.getElementById('display-height').value = h;
        document.getElementById('geom-width').value = w;
        document.getElementById('geom-height').value = h;
        statusEl.textContent = d.resolution || '';
        if (canvas) canvas.setDisplayResolution(w, h);
    } catch(e) { statusEl.textContent = 'Failed'; }
}

async function loadDisplayMode() {
    try {
        const r = await fetch('/api/display/mode');
        const d = await r.json();
        const mode = d.mode || '1080p';
        document.getElementById('mode-1080p').classList.toggle('active', mode === '1080p');
        document.getElementById('mode-4k').classList.toggle('active', mode === '4k');
        document.getElementById('mode-status').textContent = d.resolution || '';
    } catch(e) {}
}

let currentSyncMode = 'disabled';

async function loadSyncStatus() {
    try {
        const r = await fetch('/api/sync');
        const d = await r.json();
        applySyncStatus(d);
    } catch(e) {}
}

function applySyncStatus(d) {
    currentSyncMode = d.mode || 'disabled';
    ['disabled','master','remote'].forEach(m => {
        document.getElementById('sync-mode-' + m).classList.toggle('active', m === currentSyncMode);
    });
    document.getElementById('sync-master-ip-group').style.display = currentSyncMode === 'remote' ? 'block' : 'none';
    document.getElementById('sync-status-box').style.display = currentSyncMode === 'disabled' ? 'none' : 'block';
    document.getElementById('remotes-section').style.display = currentSyncMode === 'master' ? 'block' : 'none';
    if (d.mode === 'master') {
        document.getElementById('sync-status-label').textContent = d.running ? 'Broadcasting position' : 'Not running';
        loadRemotes();
    } else if (d.mode === 'remote') {
        const drift = d.drift !== null ? ' | drift ' + (d.drift > 0 ? '+' : '') + d.drift + 's' : '';
        const corr = ' | corrections: ' + (d.corrections || 0);
        const last = d.last_rx ? ' | last rx: ' + new Date(d.last_rx*1000).toLocaleTimeString() : '';
        document.getElementById('sync-status-label').textContent = (d.running ? 'Listening' : 'Not running') + drift + corr + last;
    }
}

async function setSyncMode(mode) {
    const masterIp = mode === 'remote' ? (document.getElementById('sync-master-ip').value.trim() || null) : null;
    try {
        const r = await fetch('/api/sync', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({mode, master_ip: masterIp})
        });
        const d = await r.json();
        applySyncStatus({...d, running: mode !== 'disabled', drift: null, corrections: 0});
    } catch(e) { alert('Sync configure failed: ' + e); }
}

async function loadRemotes() {
    try {
        const r = await fetch('/api/remotes');
        const remotes = await r.json();
        renderRemotes(remotes);
    } catch(e) {}
}

function renderRemotes(remotes) {
    const list = document.getElementById('remotes-list');
    if (remotes.length === 0) {
        list.innerHTML = '<p style="color:#888;font-size:0.8rem;">No remote players configured.</p>';
        return;
    }
    list.innerHTML = remotes.map(function(r) {
        var ip = r.ip;
        var port = r.port || 5000;
        var name = r.name || r.ip;
        return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 8px;background:#1a1a2e;border-radius:6px;">'
            + '<span id="ping-' + ip + '" style="font-size:0.75rem;color:#888;">●</span>'
            + '<span style="flex:1;font-size:0.85rem;">' + name + ' <span style="color:#888;">' + ip + ':' + port + '</span></span>'
            + '<button class="btn btn-secondary" style="padding:2px 8px;font-size:0.75rem;" onclick="pingRemote(&quot;' + ip + '&quot;)">Ping</button>'
            + '<button class="btn btn-danger" style="padding:2px 8px;font-size:0.75rem;" onclick="removeRemote(&quot;' + ip + '&quot;)">X</button>'
            + '</div>';
    }).join('');
    remotes.forEach(r => pingRemote(r.ip));
}

async function addRemote() {
    const ip = document.getElementById('remote-ip').value.trim();
    const port = parseInt(document.getElementById('remote-port').value) || 5000;
    const name = document.getElementById('remote-name').value.trim() || ip;
    if (!ip) { alert('Please enter an IP address'); return; }
    try {
        const r = await fetch('/api/remotes', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ip, port, name})
        });
        const d = await r.json();
        if (d.error) { alert(d.error); return; }
        document.getElementById('remote-ip').value = '';
        document.getElementById('remote-name').value = '';
        loadRemotes();
    } catch(e) { alert('Failed to add remote: ' + e); }
}

async function removeRemote(ip) {
    try {
        await fetch('/api/remotes/' + ip, {method: 'DELETE'});
        loadRemotes();
    } catch(e) {}
}

async function pingRemote(ip) {
    const el = document.getElementById('ping-' + ip);
    if (!el) return;
    try {
        const r = await fetch('/api/remotes/' + ip + '/ping');
        const d = await r.json();
        el.style.color = d.status === 'online' ? '#22c55e' : '#ef4444';
        el.title = d.status;
    } catch(e) {
        if (el) el.style.color = '#ef4444';
    }
}

setInterval(() => { if (currentSyncMode !== 'disabled') loadSyncStatus(); }, 2000);
loadDisplayMode();
loadSyncStatus();
</script>

</body>
</html>
